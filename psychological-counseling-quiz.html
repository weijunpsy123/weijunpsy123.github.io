<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中学生心理辅导与教育｜8周课堂测验</title><meta name="description" content="8周共400道课堂选择题，每周独立作答并即时查看答案解析"><style>:root{--green:#123f36;--cream:#f6f2e8;--yellow:#f2c94c;--ink:#17201e;--muted:#68736f;--line:#d9ded9;--red:#b9453f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}.hero{background:var(--green);color:#fff;padding:50px 20px 42px}.hero-inner,main,.part-nav,.progress-wrap,.week-heading{max-width:1040px;margin:auto}.eyebrow{color:var(--yellow);font-weight:700;letter-spacing:.08em}h1{font-size:clamp(34px,7vw,58px);line-height:1.1;margin:12px 0}.hero-copy{color:#dbe9e5}.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.meta-row span,.tag{font-size:13px;border:1px solid #ffffff50;border-radius:999px;padding:5px 10px}.part-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:22px 20px 10px}.part-nav button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px;text-align:left;color:var(--ink);cursor:pointer}.part-nav button.active{background:var(--green);color:#fff;border-color:var(--green)}.part-nav span,.part-nav strong,.part-nav small{display:block}.part-nav span{color:#b58500;font-weight:800;font-size:12px}.part-nav strong{margin:3px 0;font-size:14px}.part-nav small{font-size:11px}.week-heading{padding:18px 20px 0}.week-heading h2{font-size:25px;margin:0}.progress-wrap{padding:12px 20px}.prow{display:flex;justify-content:space-between}.track{height:9px;background:#dfe4df;border-radius:9px;overflow:hidden;margin-top:8px}.bar{height:100%;background:var(--yellow);transition:.25s}main{padding:5px 20px 40px}.result{margin:10px 0 20px;padding:22px;background:#e3f0eb;border:1px solid #b5d5c8;border-radius:18px}.result>strong{font-size:36px;color:var(--green)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;scroll-margin:20px}.card.missing{border:2px solid var(--yellow)}.top{display:flex;gap:9px;align-items:center}.num{font-weight:900;color:var(--green)}.tag{background:#edf4f1;border-color:#d4e2dc;color:var(--green)}h2{font-size:19px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;cursor:pointer}.option:has(input:checked){border-color:var(--green);background:#eef5f2}.option.correct{border-color:#3b8a68;background:#e7f5ed}.option.wrong{border-color:var(--red);background:#fae9e8}.letter{display:grid;place-items:center;min-width:28px;height:28px;border-radius:50%;background:#edf0ed;font-weight:800}.status{margin-left:auto;font-size:12px;font-weight:700}.explain{margin-top:14px;border-left:4px solid var(--yellow);padding:10px 14px;background:#fff9e5}.missingText{color:#a36d00;font-size:13px}.submit{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--green);color:#fff;border-radius:18px;padding:20px;margin-top:22px}.primary,.secondary{border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:var(--yellow);color:#332800}.secondary{background:#fff;color:var(--green);margin-left:14px}footer{text-align:center;padding:25px 20px 50px;color:var(--muted);font-size:13px}@media(max-width:800px){.part-nav{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.part-nav{grid-template-columns:1fr}.submit{display:block}.primary{width:100%;margin-top:14px}.secondary{display:block;margin:12px 0 0}}
</style></head><body><header class="hero"><div class="hero-inner"><div class="eyebrow">中学生心理辅导与教育 · 课程测验</div><h1>8周课堂选择题</h1><p class="hero-copy">共400道单选题 · 每周50题 · 分别提交并即时查看答案解析</p><div class="meta-row"><span>建议每周20–30分钟</span><span>每题1分</span><span>依据8份课程课件编制</span></div></div></header><nav class="part-nav" id="nav"></nav><div class="week-heading"><h2 id="weekTitle"></h2></div><div class="progress-wrap" id="progress"></div><main><section id="result"></section><section class="quiz" id="quiz"></section><section id="submit"></section><footer><p>本测验依据课程课件编制，仅用于课堂学习与复习。</p></footer></main><script>const weeks=[{"title":"第1周：中学生心理辅导概述","shortTitle":"心理辅导概述","questions":[{"section":"基本概念","stem":"心理辅导最核心的目标是帮助来访者怎样发展？","options":["服从辅导者的安排","认识、接纳自己并发挥潜能","回避所有负面情绪","获得医学诊断"],"answer":1,"explanation":"心理辅导强调协助来访者认识、接纳和欣赏自己，克服成长障碍并发挥个人潜能。"},{"section":"基本概念","stem":"下列哪一项不属于心理辅导的基本特征？","options":["是一种专业助人行为","重视良好的人际关系气氛","是一种学习和人格成长过程","主要依靠行政命令改变行为"],"answer":3,"explanation":"心理辅导依靠专业关系和心理学技术，不是依靠行政命令。"},{"section":"基本概念","stem":"心理辅导主要处理的是来访者哪一方面的问题？","options":["心理或精神方面的问题","所有身体疾病","法律纠纷","经济困难本身"],"answer":0,"explanation":"课件强调，心理辅导主要解决来访者心理或精神方面存在的问题。"},{"section":"基本概念","stem":"学校心理辅导是一种怎样的活动？","options":["仅对问题学生开展的医疗活动","促进学生心理健康与人格和谐发展的教育活动","只进行心理测验的活动","取代学校德育的活动"],"answer":1,"explanation":"学校心理辅导综合运用多学科理论和多种形式，帮助学生自我认识、自我接纳和自我调节。"},{"section":"基本概念","stem":"中学生心理辅导的对象主要是？","options":["全体中学生","仅有心理疾病的学生","仅毕业班学生","仅学习困难学生"],"answer":0,"explanation":"中学生心理辅导面向全体中学生，以发展性和预防性辅导为主。"},{"section":"基本概念","stem":"中学生心理辅导在功能定位上应当？","options":["以治疗性辅导为主","以发展性和预防性辅导为主","完全由医院实施","只关注成绩提高"],"answer":1,"explanation":"课件明确提出以发展性和预防性辅导为主，治疗性辅导为辅。"},{"section":"对象与目标","stem":"心理健康教育的总目标不包括下列哪一项？","options":["提高全体学生心理素质","充分开发学生潜能","培养乐观向上的心理品质","消除学生之间的一切差异"],"answer":3,"explanation":"心理健康教育尊重个体差异，并不以消除差异为目标。"},{"section":"对象与目标","stem":"下列哪项属于中学生心理辅导的内容？","options":["形成正确的自我意识","代替家庭作出所有决定","取消学业评价","避免所有社会交往"],"answer":0,"explanation":"课件列出的内容包括正确自我意识、社会适应、社会交往和学业能力。"},{"section":"对象与目标","stem":"中学生进入青春期后，对异性产生好奇和兴趣主要与什么变化有关？","options":["性的成熟","语言退化","记忆消失","社会角色完全固定"],"answer":0,"explanation":"青春期性的成熟会使中学生对异性产生好奇和兴趣。"},{"section":"对象与目标","stem":"下列哪一组属于中学生“成人感与幼稚性”矛盾的表现？","options":["反抗性与依赖性","成熟性与稳定性","理性与客观性","独立性与一致性"],"answer":0,"explanation":"课件列出反抗与依赖、闭锁与开放、勇敢与懦弱、高傲与自卑等矛盾。"},{"section":"原则与途径","stem":"对学生在辅导中透露的信息谨慎处理，主要体现哪项原则？","options":["主体性原则","保密性原则","整体性原则","教育性原则"],"answer":1,"explanation":"保密性原则要求妥善保护辅导信息，但涉及伤害风险等情况时需按专业规范处理。"},{"section":"原则与途径","stem":"根据学生年龄、个性和问题特点采用不同方式，主要体现？","options":["差异性原则","保密性原则","整体性原则","教育性原则"],"answer":0,"explanation":"差异性原则要求尊重个体差异，采用适合具体学生的辅导方法。"},{"section":"原则与途径","stem":"强调学生主动参与并发挥自身力量，主要体现？","options":["尊重性原则","主体性原则","保密性原则","整体性原则"],"answer":1,"explanation":"主体性原则强调学生是自我成长和改变的主体。"},{"section":"原则与途径","stem":"下列哪项不是课件列出的学校心理辅导途径？","options":["开设专门心理辅导课","在学科教学中渗透","开展个别心理咨询与辅导","用纪律处分替代心理辅导"],"answer":3,"explanation":"心理辅导可通过课程、学科渗透、个别辅导及家校社沟通开展，不能被纪律处分替代。"},{"section":"问题辨别","stem":"“暂时性的心理失衡，经过自我调节或他人帮助可较快解决”属于？","options":["心理问题","心理障碍","心理疾病","人格成熟"],"answer":0,"explanation":"这是课件对一般心理问题的界定。"},{"section":"问题辨别","stem":"持续时间较长、反应较强且自身难以克服，并影响正常生活的局部心理功能失调，属于？","options":["心理问题","心理障碍","正常波动","学习风格"],"answer":1,"explanation":"这是心理障碍的主要特征，需要更专业的评估与帮助。"},{"section":"问题辨别","stem":"当心理状态已使个体无法正常学习和工作，并超出学校心理辅导范围时，应首先考虑？","options":["继续只做一般谈心","转介专业医疗或心理治疗机构","要求学生自行忍耐","公开学生隐私"],"answer":1,"explanation":"严重且持续的心理疾病超出一般心理辅导范围，应及时进行专业转介。"},{"section":"基本概念","stem":"心理辅导区别于一般帮助活动的重要标志是？","options":["完全依靠个人经验","具有专业知识、技术与规范","不需要建立关系","只提供现成答案"],"answer":1,"explanation":"心理辅导是一种专业助人行为，需要运用心理学知识、技术并遵循专业规范。"},{"section":"基本概念","stem":"心理辅导中特别强调安全感和信任感，是因为？","options":["良好关系是辅导有效开展的重要条件","可以避免来访者表达真实想法","辅导者必须替来访者作决定","所有问题都能一次解决"],"answer":0,"explanation":"良好的辅导关系能够帮助来访者形成安全感和信任感，从而进行真实、开放的交流。"},{"section":"基本概念","stem":"学校心理辅导与德育之间更适合被理解为？","options":["完全相互排斥","相互联系并相互补充","心理辅导取代德育","二者内容和方法完全相同"],"answer":1,"explanation":"学校心理辅导与德育既有区别，也相互联系、相互补充。"},{"section":"对象与目标","stem":"中学生心理辅导与学校教育的关系是？","options":["应与学校教育协同进行","必须脱离学校课程","只在校外开展","与教师工作无关"],"answer":0,"explanation":"课件强调中学生心理辅导应当与学校教育协同进行。"},{"section":"对象与目标","stem":"下列哪项最符合中学生心理辅导的主要目标？","options":["促进健康成长、激发潜能并培养健全人格","只让学生在考试中得高分","让所有学生形成相同个性","避免学生经历任何挫折"],"answer":0,"explanation":"中学生心理辅导关注健康成长、学业能力、自我潜能与健全人格。"},{"section":"对象与目标","stem":"“闭锁性与开放性”并存主要说明青春期心理发展具有？","options":["矛盾性","完全稳定性","无差异性","不可发展性"],"answer":0,"explanation":"青春期成人感与幼稚性并存，常表现出多组相互矛盾的心理特点。"},{"section":"原则与途径","stem":"把学生放在家庭、学校和社会环境中综合理解，主要体现？","options":["整体性原则","保密性原则","差异性原则","尊重性原则"],"answer":0,"explanation":"整体性原则要求从个体及其所处环境的相互联系中理解和帮助学生。"},{"section":"原则与途径","stem":"家庭、学校与社区沟通合作的主要意义是？","options":["形成协同支持学生的环境","把责任全部转给家长","公开学生所有个人信息","取消学校心理辅导"],"answer":0,"explanation":"家校社沟通有助于整合资源，为学生建立连续、协调的支持环境。"},{"section":"精神分析","stem":"弗洛伊德人格结构中，遵循“快乐原则”的是？","options":["本我","自我","超我","现实我"],"answer":0,"explanation":"本我由原始本能组成，追求当前需要的即时满足，遵循快乐原则。"},{"section":"精神分析","stem":"在人格结构中协调本我、超我与现实要求的是？","options":["本我","自我","超我","潜意识"],"answer":1,"explanation":"自我由本我分化而来，依据现实原则进行协调。"},{"section":"精神分析","stem":"监督、批判和约束自身行为，并遵循“道德原则”的是？","options":["本我","自我","超我","前意识"],"answer":2,"explanation":"超我是人格中的理想与道德部分。"},{"section":"精神分析","stem":"弗洛伊德人格发展阶段中，0—1.5岁大致属于？","options":["口唇期","肛门期","性器期","潜伏期"],"answer":0,"explanation":"口唇期约为0—1.5岁，满足主要通过口腔活动获得。"},{"section":"精神分析","stem":"儿童兴趣由身体和父母转向周围事物、同性团体更突出，大致属于？","options":["口唇期","肛门期","潜伏期","生殖期"],"answer":2,"explanation":"潜伏期约为6—12岁，原始欲力相对处于潜伏状态。"},{"section":"精神分析","stem":"下列哪项属于课件所列的积极防卫机制？","options":["投射","潜抑","升华","反向"],"answer":2,"explanation":"升华、补偿、幽默、利他和仿同被列为积极防卫机制。"},{"section":"精神分析","stem":"把自己不能接受的欲望或特点归因于别人，属于哪种防卫机制？","options":["投射","升华","幽默","利他"],"answer":0,"explanation":"投射是把自身难以接受的冲动、想法或特点归到他人身上。"},{"section":"精神分析","stem":"鼓励来访者说出浮现在脑海中的任何想法，以发现无意识冲突的方法是？","options":["自由联想","系统脱敏","代币疗法","理性抗辩"],"answer":0,"explanation":"自由联想通过不加筛选地表达联想内容来探索无意识冲突。"},{"section":"精神分析","stem":"精神分析认为，通过分析梦的象征内容可以探索？","options":["被压抑的欲望与冲突","操作性条件反射","课堂强化计划","社会学习过程"],"answer":0,"explanation":"释梦被用于探索梦中象征内容与被压抑欲望、冲突之间的联系。"},{"section":"发展理论","stem":"埃里克森认为，青少年期最主要的发展矛盾是？","options":["信任对不信任","自主对羞怯","角色同一性对角色混乱","繁衍对停滞"],"answer":2,"explanation":"12—18岁左右的核心任务是形成角色同一性，回答“我是谁”等问题。"},{"section":"行为主义","stem":"“狗的条件反射实验”主要体现哪种学习理论？","options":["经典条件反射","操作性条件作用","观察学习","顿悟学习"],"answer":0,"explanation":"巴甫洛夫的实验是经典条件反射的代表。"},{"section":"行为主义","stem":"把强化与有机体发出的操作反应联系起来，属于？","options":["经典条件反射","操作性条件作用","精神分析","来访者中心疗法"],"answer":1,"explanation":"斯金纳的操作性条件作用强调行为后果对行为发生概率的影响。"},{"section":"行为主义","stem":"班杜拉社会学习过程首先需要经过？","options":["注意过程","保持过程","动作再现过程","动机过程"],"answer":0,"explanation":"观察学习通常包括注意、保持、动作再现和动机四个过程。"},{"section":"行为主义","stem":"缓慢暴露于焦虑情境，同时用放松反应对抗焦虑，属于？","options":["系统脱敏法","满灌疗法","厌恶疗法","自由联想"],"answer":0,"explanation":"系统脱敏强调分级、渐进暴露，并以放松状态对抗焦虑。"},{"section":"行为主义","stem":"让个体直接、持续接触引起恐惧的情境，直至恐惧减弱，属于？","options":["代币疗法","满灌疗法","释梦","合理情绪疗法"],"answer":1,"explanation":"满灌疗法采用快速、直接暴露方式，应由受过训练的专业人员审慎实施。"},{"section":"行为主义","stem":"个体出现预期良好行为后立即给予奖励，以巩固该行为，属于？","options":["代币疗法","厌恶疗法","催眠","投射"],"answer":0,"explanation":"代币疗法以代币或奖励强化目标行为。"},{"section":"行为主义","stem":"把令人厌恶的刺激与不良行为结合，以建立新的条件反射，属于？","options":["系统脱敏法","厌恶疗法","满灌疗法","自由联想"],"answer":1,"explanation":"厌恶疗法利用条件反射原理削弱不良行为，实际应用须遵循伦理与专业规范。"},{"section":"人本与认知","stem":"罗杰斯来访者中心疗法的核心条件不包括？","options":["共情","真诚","无条件积极关注","对来访者进行强制说服"],"answer":3,"explanation":"人本主义强调共情、真诚和无条件积极关注，而不是强制说服。"},{"section":"人本与认知","stem":"埃利斯认为，导致情绪困扰和异常行为反应的重要原因是？","options":["事件本身必然造成","不合理的认知和信念","所有童年经历","缺少外部惩罚"],"answer":1,"explanation":"理性情绪疗法认为，个体对事件的看法和信念会影响其情绪与行为。"},{"section":"人本与认知","stem":"“一次考试失败就说明我永远不会成功”主要体现哪种不合理信念？","options":["绝对化","过分概括化","合理推断","无条件积极关注"],"answer":1,"explanation":"由一次失败推断整体和未来，是以偏概全、以一概十的过分概括化。"},{"section":"人本与认知","stem":"“如果这次没有得到第一名，一切都彻底完了”主要体现？","options":["糟糕至极","观察学习","升华","主体性"],"answer":0,"explanation":"把可能的不良后果无限严重化，属于“糟糕至极”的思维方式。"},{"section":"人本与认知","stem":"“所有人都必须喜欢我”最突出地表现出哪种不合理信念？","options":["绝对化要求","合理愿望","观察学习","积极关注"],"answer":0,"explana T目标的时限性”，下列说法正确的是？","options":["目标应明确开始、截止或检查时间。","结合自身特点与环境机遇、限制，对职业方向和行动进行规划。","偏好分析、探索、推理和解决复杂问题。","需要加强专业机构和教师队伍建设。"],"answer":0,"explanation":"SMART目标的时限性：目标应明确开始、截止或检查时间。"},{"section":"生涯与时间管理","stem":"关于“第二象限原则”，下列说法正确的是？","options":["重点是自我建立与早期角色尝试。","优先投入重要但不紧急的规划、学习和预防性事务。","偏好创造、表达、想象和非结构化活动。","生涯发展贯穿较长时期，不宜只在升学节点临时开展。"],"answer":1,"explanation":"第二象限原则：优先投入重要但不紧急的规划、学习和预防性事务。"},{"section":"生涯与时间管理","stem":"关于“韵律原则”，下列说法正确的是？","options":["大致在15—24岁探索职业选择，并与兴趣和能力相匹配。","偏好帮助、教育、沟通和服务他人。","减少不必要打扰，按个人精力节律安排重要任务。","不应只追求短期选科、报考或就业结果。"],"answer":2,"explanation":"韵律原则：减少不必要打扰，按个人精力节律安排重要任务。"},{"section":"生涯与时间管理","stem":"关于“帕金森定律”，下列说法正确的是？","options":["需要觉知、评估、定目标、找策略、实践、反省和调整。","偏好影响、组织、领导、经营和目标达成。","职业世界持续变化，辅导内容应与时俱进。","工作会扩张并占满可供它使用的全部时间。"],"answer":3,"explanation":"帕金森定律：工作会扩张并占满可供它使用的全部时间。"},{"section":"生涯与时间管理","stem":"关于“崔西定律”，下列说法正确的是？","options":["工作难度会随执行步骤数量增加而显著上升，应优化流程。","客观评估自己的兴趣、能力、性格、价值观和资源。","需要思考我是谁、想做什么和能够做什么。","横向层面表示贯穿一生的不同发展阶段。"],"answer":0,"explanation":"崔西定律：工作难度会随执行步骤数量增加而显著上升，应优化流程。"},{"section":"生涯与时间管理","stem":"关于“时间管理的执行”，下列说法正确的是？","options":["分析教育、职业、家庭和社会环境中的机会与限制。","明确价值和目标后，持续执行是时间管理能否见效的关键。","需要思考环境支持或允许自己做什么。","不同角色会在生命历程中以不同程度同时存在。"],"answer":1,"explanation":"时间管理的执行：明确价值和目标后，持续执行是时间管理能否见效的关键。"}]}];
const letters=['A','B','C','D'];let activeWeek=0,answers={},submitted={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(i){return activeWeek+'-'+i}
function render(){
  const week=weeks[activeWeek],qs=week.questions,done=qs.filter((_,i)=>answers[key(i)]!==undefined).length;
  const score=qs.filter((q,i)=>answers[key(i)]===q.answer).length,isSub=!!submitted[activeWeek],pct=Math.round(score/qs.length*100);
  document.querySelector('#nav').innerHTML=weeks.map((w,i)=>`<button class="${activeWeek===i?'active':''}" onclick="switchWeek(${i})"><span>第${i+1}周</span><strong>${esc(w.shortTitle)}</strong><small>50题${submitted[i]?' · 已提交':''}</small></button>`).join('');
  document.querySelector('#weekTitle').textContent=week.title;
  document.querySelector('#progress').innerHTML=`<div class="prow"><strong>${isSub?'本周答题结果':`本周已完成 ${done}/${qs.length}`}</strong><span>${isSub?pct+' 分':Math.round(done/qs.length*100)+'%'}</span></div><div class="track"><div class="bar" style="width:${isSub?pct:done/qs.length*100}%"></div></div>`;
  document.querySelector('#result').innerHTML=isSub?`<div class="result"><strong>${score} / ${qs.length}</strong><h2>${pct>=90?'掌握得很扎实！':pct>=75?'整体掌握良好':pct>=60?'基础内容已经掌握':'建议结合解析再复习一次'}</h2><p>绿色为正确答案，红色为你的错误选择。</p><button class="secondary" onclick="resetWeek()">重新作答本周</button></div>`:'';
  document.querySelector('#quiz').innerHTML=qs.map((q,i)=>{const k=key(i),sel=answers[k];return `<article class="card" id="q${i}"><div class="top"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="tag">${esc(q.section)}</span></div><h2>${esc(q.stem)}</h2>${q.options.map((o,j)=>`<label class="option ${isSub&&j===q.answer?'correct':''} ${isSub&&sel===j&&j!==q.answer?'wrong':''}"><input type="radio" name="q${i}" ${sel===j?'checked':''} ${isSub?'disabled':''} onchange="choose(${i},${j})"><span class="letter">${letters[j]}</span><span>${esc(o)}</span>${isSub&&j===q.answer?'<span class="status">正确答案</span>':''}${isSub&&sel===j&&j!==q.answer?'<span class="status">你的选择</span>':''}</label>`).join('')}${isSub?`<div class="explain"><strong>解析</strong><div>${esc(q.explanation)}</div></div>`:''}</article>`}).join('');
  document.querySelector('#submit').innerHTML=isSub?'':`<div class="submit"><div><strong>${done===qs.length?'本周题目已全部完成':`本周还有 ${qs.length-done} 题未完成`}</strong><div>提交后可以查看答案并重新作答。</div></div><button class="primary" onclick="submitWeek()">提交本周并查看答案</button></div>`;
}
function choose(i,v){answers[key(i)]=v;render()}
function switchWeek(i){activeWeek=i;scrollTo(0,0);render()}
function submitWeek(){const qs=weeks[activeWeek].questions;for(let i=0;i<qs.length;i++)if(answers[key(i)]===undefined){const el=document.querySelector('#q'+i);el.classList.add('missing');el.insertAdjacentHTML('beforeend','<div class="missingText">这道题还没有作答</div>');el.scrollIntoView({behavior:'smooth',block:'center'});return}submitted[activeWeek]=true;scrollTo({top:0,behavior:'smooth'});render()}
function resetWeek(){for(let i=0;i<weeks[activeWeek].questions.length;i++)delete answers[key(i)];delete submitted[activeWeek];scrollTo(0,0);render()}
render();
</script></body></html>
